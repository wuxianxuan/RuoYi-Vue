# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: D:/ruoyi/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: info
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: false
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password: wxx201233
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms
  # 邮件配置（尾盘推荐推送用，请填入你自己的 SMTP 账号和授权码）
  mail:
    host: smtp.qq.com
    port: 465
    username: 494417427@qq.com
    password: suxtwgckkiuxcaei
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          timeout: 10000

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 股票数据源配置
stock:
  # 腾讯批量行情（每日行情快照，替代原同花顺 JSON 行情）
  quote:
    tencent:
      # 批量行情地址前缀，一次可带多只代码
      batch-url: https://qt.gtimg.cn/q=
      # 每批请求数量
      batch-size: 60
  # 限售解禁日程（东方财富 RPT_LIFT_STAGE）
  lockup:
    api-url: https://datacenter-web.eastmoney.com/api/data/v1/get
    page-size: 500
    # 每次同步未来多少天
    sync-days: 120
    # 风险过滤窗口：未来 N 天内
    risk-window-days: 20
    # 风险过滤阈值：解禁比例（占流通市值）>= 该值则剔除候选
    risk-min-ratio: 0.05
    # 解禁前「庄家引导拉升」子信号（实验性，严格过滤后给 2 个尾盘名额）
    guided:
      # 解禁日窗口：未来 5~45 天
      window-start-days: 5
      window-end-days: 45
      # 解禁比例区间（占流通市值）
      min-ratio: 0.03
      max-ratio: 0.20
      # 最多入池数量
      size: 3
  # 全市场股票列表/新股同步（基础页不再手工新增）
  list-sync:
    api-url: https://push2.eastmoney.com/api/qt/clist/get
    page-size: 5000
  # 日期分组清理：只清名称以 _yyyy-MM-dd 结尾的分组
  group-clean:
    keep-days: 30
  # 数据完整性校验
  data-check:
    quote-min: 5000
    kline-min: 5000
  # K线数据源
  kline:
    tencent:
      base-url: https://proxy.finance.qq.com
  # 财联社数据源
  cls:
    sign: 6dfce97fbf19527e4957cca0127feafd
  # 趋势上涨选股配置（波段状态机算法）
  rising-trend:
    # 回看日历天数（重算锚点，需覆盖 MA/ATR 预热期 + 波段历史，默认120）
    # 说明：进池要求 MA20/ATR20 预热完成（至少 20 根日K），90 天只剩 60 个交易日，会漏掉早期进池的老票
    lookback-days: 120
    # 进池窗口天数（N）：近 N 日内无涨停、区间涨幅达标、创 N 日新高
    entry-window: 5
    # 进池区间涨幅阈值(%)：窗口内 (最高-最低)/最低 >= 该值
    min-gain: 5.0
    # 涨停判定阈值(%)：窗口内单日涨幅 >= 该值视为涨停，进池时过滤
    limit-up-threshold: 9.8
    # 趋势过滤均线周期：进池要求收盘 > MA(该周期)，拦截跌深后的超跌反弹
    ma-period: 20
    # ATR 周期
    atr-period: 20
    # 震荡阈值(ATR倍数)：回撤 <= 该值视为震荡
    shake-atr: 1.0
    # 删除阈值(ATR倍数)：回撤 > 该值移出积累池
    delete-atr: 2.0
    # 删除后重新进池的冷却交易日数：避免同一波段被反复"删除-重进"
    reentry-cooldown-days: 10
    # 是否排除 ST/*ST 股票
    exclude-st: true
    # 扫描市场列表（逗号分隔）
    markets: SH,SZ
    # 排除的板块代码前缀（逗号分隔），默认排除创业板(300/301)、科创板(688/689)
    exclude-code-prefixes: 300,301,688,689
    # 积累池分组名（119 从这里读取趋势候选）
    group-name: 趋势上涨选股
  # 次日推荐池（119 盘后生成，117 次日盘中消费）
  recommend-pool:
    # 推荐池分组名前缀（实际名称为 前缀_目标交易日）
    group-name: 次日推荐池
    # 趋势来源最多入池数量
    trend-size: 30
    # 涨停来源最多入池数量
    limit-up-size: 30
    # 抗追高：近5日累计涨幅上限(%)、相对MA20乖离上限(%)
    max-gain-5d: 15.0
    max-bias-ma20: 12.0
    # 换手率门槛（按流通市值分档）
    min-turnover-rate: 3.0
    small-cap-turnover-rate: 5.0
    large-cap-turnover-rate: 1.5
    small-cap-yi: 50
    large-cap-yi: 200
    # 是否排除 ST
    exclude-st: true
    # 排除的板块代码前缀
    exclude-code-prefixes: 300,301,688,689
  # 分时K线增量落库（由 stockKlineSyncTask 在日K同步完成后调用）
  # 默认全市场采集（不确定后续分析用到哪些股票），只写库中尚不存在的 bar
  minute-collect:
    # 是否启用
    enabled: true
    # 是否全市场（true=全部 SH/SZ；false=只采涨停股+趋势池）
    include-all: true
    # 分时K线类型（写入 stock_kline.kline_type）
    minute-type: m5
    # include-all=false 时，是否纳入趋势上涨池（stock_rising_state）
    include-pool: true
    # 每只票每次拉取的 bar 数量（96=最近2天，响应体积约为320根的1/3）
    fetch-bars: 96
    # 并行线程数（日K同步用50，分时对齐后全市场约3-5分钟）
    thread-pool-size: 32
  # 首二板回调尾盘推荐（每个交易日 14:46 运行）
  # 思路：昨日涨停的首板/二板，次日回调时用分时数据判断承接质量，只推企稳的票
  limit-up-pullback:
    # 分组名（固定名，不含日期）
    group-name: 首二板回调
    # 分时K线类型
    minute-type: m5
    # 每日最多推荐数量（按承接评分取前N）
    top-n: 10
    # 回调幅度区间(%)：低于下限视为深跌不接，高于上限不算回调
    min-pullback: -4.0
    max-pullback: 1.5
    # 分时收盘位置下限(0~1)：不在日内最低附近
    min-close-pos: 0.45
    # 现价相对分时均价线(VWAP)的偏离下限(%)：低于该值说明承接弱
    min-vwap-dev: -0.5
    # 尾盘30分钟涨跌下限(%)：过滤尾盘跳水
    min-tail-change: -0.5
    # 涨停日振幅上限(%)：振幅过大说明分歧大
    max-limit-up-amplitude: 12.0
    # 是否排除一字板（回测中一字板次日表现最差）
    exclude-one-line: true
    # 流通市值下限(亿元)：微盘不接
    min-cap-yi: 30
    # 换手率区间(%)
    min-turnover-rate: 3.0
    max-turnover-rate: 20.0
    # 尾盘30分钟对应的5分钟bar数量
    tail-bars: 6
    # 并行抓取线程数
    thread-pool-size: 8
  # 尾盘推荐配置（每个交易日 14:45 运行）
  # 口径：先排"已经涨透/透支"的风险，再看当日强度，最后按评分取前 top-n 只
  tail-recommend:
    # 分组名（固定名，不含日期）
    group-name: 尾盘推荐
    # 规则版本：写入实验记录表，调整参数时同步改这里，便于对比不同参数组合的实际表现
    rule-version: v2
    # 分时K线类型
    minute-type: m5
    # 未涨停阈值(%)：当日涨幅 >= 该值视为涨停，尾盘买不进
    max-gain: 9.5
    # 当日涨幅上限(%)：超过视为已经涨透，不再追高（防次日回调的核心参数）
    max-close-gain: 7.0
    # 当日涨幅下限(%)
    min-gain: 0.5
    # 高开上限(%)：开盘涨幅超过该值视为跳空追高
    max-open-gain: 3.0
    # 收盘位置下限(0~1)：收盘价相对当日[最低,最高]区间的比例
    min-close-pos: 0.7
    # 尾盘30分钟涨跌下限(%)：负值表示允许小幅回落，过滤真正的尾盘跳水
    min-tail-change: -0.5
    # 量比区间：下限=放量确认，上限=过度放量（分歧大，次日易回落）
    # 数据来源：腾讯分时接口同一次响应里的 qt 实时行情块（请求时刻的值），取不到才退回行情表
    min-volume-ratio: 1.2
    max-volume-ratio: 3.0
    # 换手率区间(%)：下限=流动性，上限=高位分歧/接盘
    min-turnover-rate: 3.0
    max-turnover-rate: 15.0
    # 近5日累计涨幅上限(%)：截至昨日，超过视为涨幅已透支
    max-gain-5d: 15.0
    # 相对MA5乖离上限(%)：现价偏离5日均线过远，回调概率大
    max-bias-ma5: 5.0
    # 当日成交额下限(亿元)：由分时成交量估算，过滤流动性差的票
    min-turnover-amount: 1.0
    # 理想涨幅(%)：评分时涨幅最优点，偏离越远得分越低
    ideal-gain: 2.5
    # 117 最终推荐名额：趋势来源 5 只 + 涨停首二板来源 5 只（不跨来源补位）
    trend-quota: 5
    limit-up-quota: 5
    # 解禁引导来源额外名额（实验性，蹭一波）
    lockup-quota: 2
    # 并行抓取分时K线的线程数
    thread-pool-size: 16
    # 尾盘30分钟对应的5分钟bar数量
    tail-bars: 6
  # 邮件推送配置（把推荐结果推到手机邮箱）
  notify:
    # 是否启用邮件推送
    enabled: true
    # 收件邮箱（多个用逗号分隔）
    to: 494417427@qq.com
    # 发件人（留空默认取 spring.mail.username）
    from:
    # 邮件主题前缀
    subject: 尾盘推荐

