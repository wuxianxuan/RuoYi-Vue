# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: D:/ruoyi/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: info
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: false
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password: wxx201233
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms
  # 邮件配置（尾盘推荐推送用，请填入你自己的 SMTP 账号和授权码）
  mail:
    host: smtp.qq.com
    port: 465
    username: 494417427@qq.com
    password: suxtwgckkiuxcaei
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          timeout: 10000

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 股票数据源配置
stock:
  # 同花顺个股行情 — 数据来自 stock-tools Node.js 抓取脚本
  ths:
    quote:
      # 抓取结果 JSON 文件路径（由 stock-tools/fetchers/ths-quote.js 生成）
      data-file: ../stock-tools/data/ths_quotes.json
    funds:
      # 概念资金流向 JSON 文件路径
      concept-file: ../stock-tools/data/ths_funds_concept.json
      # 行业资金流向 JSON 文件路径
      industry-file: ../stock-tools/data/ths_funds_industry.json
  # 同花顺板块排名
  blockrank:
    origin: https://m.10jqka.com.cn
    referer: https://m.10jqka.com.cn/
    autoCreateStock: true
    fullReplace: true
  # K线数据源
  kline:
    tencent:
      base-url: https://proxy.finance.qq.com
  # 财联社数据源
  cls:
    sign: 6dfce97fbf19527e4957cca0127feafd
  # 行业/概念资金流向推荐引擎配置
  fund-flow-recommend:
    # 回看交易日数（资金面）
    lookback-days: 5
    # 最少连续净流入天数
    min-consecutive-days: 3
    # 累计净流入阈值（亿）
    min-net-inflow: 1.0
    # 最少公司家数（0 表示不限制）
    min-total: 0
    # 趋势回看交易日数（计算区间涨幅与 MA5/MA10）
    trend-window: 15
    # 区间涨幅阈值(%)，仅当区间涨幅 > 该值才判定走势向上
    min-trend-pct: 0
    # 趋势面（区间涨幅）权重
    weight-trend: 0.5
    # 资金面（累计净流入）权重
    weight-fund: 0.5
    # 每个类型最多推荐数量
    top-n: 10
    # 涨幅TOP同步数量（每个类型取当前涨幅前 N 个，行业+概念共 2N 个）
    top-zdf-n: 7
  # 趋势上涨选股配置（波段状态机算法）
  rising-trend:
    # 回看日历天数（重算锚点，需覆盖 MA/ATR 预热期 + 波段历史，默认120）
    # 说明：进池要求 MA20/ATR20 预热完成（至少 20 根日K），90 天只剩 60 个交易日，会漏掉早期进池的老票
    lookback-days: 120
    # 进池窗口天数（N）：近 N 日内无涨停、区间涨幅达标、创 N 日新高
    entry-window: 5
    # 进池区间涨幅阈值(%)：窗口内 (最高-最低)/最低 >= 该值
    min-gain: 5.0
    # 涨停判定阈值(%)：窗口内单日涨幅 >= 该值视为涨停，进池时过滤
    limit-up-threshold: 9.8
    # 趋势过滤均线周期：进池要求收盘 > MA(该周期)，拦截跌深后的超跌反弹
    ma-period: 20
    # ATR 周期
    atr-period: 20
    # 震荡阈值(ATR倍数)：回撤 <= 该值视为震荡
    shake-atr: 1.0
    # 删除阈值(ATR倍数)：回撤 > 该值移出积累池
    delete-atr: 2.0
    # 删除后重新进池的冷却交易日数：避免同一波段被反复"删除-重进"
    reentry-cooldown-days: 10
    # 是否排除 ST/*ST 股票
    exclude-st: true
    # 扫描市场列表（逗号分隔）
    markets: SH,SZ
    # 排除的板块代码前缀（逗号分隔），默认排除创业板(300/301)、科创板(688/689)
    exclude-code-prefixes: 300,301,688,689
  # 趋势积累池日推荐配置
  day-trading:
    # 日推荐流动性过滤：换手率下限(%)，按流通市值分档
    min-turnover-rate: 3.0
    # 小盘（流通市值 < 50 亿）换手率门槛：要求更高
    small-cap-turnover-rate: 5.0
    # 大盘（流通市值 > 200 亿）换手率门槛：盘子大、换手天然低
    large-cap-turnover-rate: 1.5
    # 小盘/大盘市值分界（亿元）
    small-cap-yi: 50
    large-cap-yi: 200
    # 每组最多输出数量（按评分取前N，<=0 表示不限）
    top-n: 10
    # 抗追高：近5日累计涨幅上限(%)、相对MA20乖离上限(%)
    max-gain-5d: 15.0
    max-bias-ma20: 12.0
    # 是否生成「震荡」日推荐分组（默认关闭，只推上升组）
    shake-group-enabled: false
    # 市场环境过滤：上涨家数占比低于阈值时当天不生成日推荐（0~1）
    # 回测（2026-07~10）显示该过滤为负贡献，默认关闭
    market-filter-enabled: false
    min-up-ratio: 0.30
    # 首二板最多输出数量（按封板时间取前N，<=0 表示不限）
    limit-up-top-n: 15
    # 涨停首二板分组名（固定名，不含日期）
    limit-up-group-name: 涨停首二板
  # 分时K线增量落库（由 stockKlineSyncTask 在日K同步完成后调用）
  # 覆盖：最近N个交易日涨停股 + 趋势上涨池，只写库中尚不存在的 bar
  minute-collect:
    # 是否启用
    enabled: true
    # 分时K线类型（写入 stock_kline.kline_type）
    minute-type: m5
    # 是否纳入趋势上涨池（stock_rising_state）
    include-pool: true
    # 并行线程数
    thread-pool-size: 8
  # 首二板回调尾盘推荐（每个交易日 14:46 运行）
  # 思路：昨日涨停的首板/二板，次日回调时用分时数据判断承接质量，只推企稳的票
  limit-up-pullback:
    # 分组名（固定名，不含日期）
    group-name: 首二板回调
    # 分时K线类型
    minute-type: m5
    # 每日最多推荐数量（按承接评分取前N）
    top-n: 10
    # 回调幅度区间(%)：低于下限视为深跌不接，高于上限不算回调
    min-pullback: -4.0
    max-pullback: 1.5
    # 分时收盘位置下限(0~1)：不在日内最低附近
    min-close-pos: 0.45
    # 现价相对分时均价线(VWAP)的偏离下限(%)：低于该值说明承接弱
    min-vwap-dev: -0.5
    # 尾盘30分钟涨跌下限(%)：过滤尾盘跳水
    min-tail-change: -0.5
    # 涨停日振幅上限(%)：振幅过大说明分歧大
    max-limit-up-amplitude: 12.0
    # 是否排除一字板（回测中一字板次日表现最差）
    exclude-one-line: true
    # 流通市值下限(亿元)：微盘不接
    min-cap-yi: 30
    # 换手率区间(%)
    min-turnover-rate: 3.0
    max-turnover-rate: 20.0
    # 尾盘30分钟对应的5分钟bar数量
    tail-bars: 6
    # 并行抓取线程数
    thread-pool-size: 8
  # 尾盘推荐配置（每个交易日 14:45 运行）
  # 口径：先排"已经涨透/透支"的风险，再看当日强度，最后按评分取前 top-n 只
  tail-recommend:
    # 分组名（固定名，不含日期）
    group-name: 尾盘推荐
    # 规则版本：写入实验记录表，调整参数时同步改这里，便于对比不同参数组合的实际表现
    rule-version: v2
    # 分时K线类型
    minute-type: m5
    # 未涨停阈值(%)：当日涨幅 >= 该值视为涨停，尾盘买不进
    max-gain: 9.5
    # 当日涨幅上限(%)：超过视为已经涨透，不再追高（防次日回调的核心参数）
    max-close-gain: 7.0
    # 当日涨幅下限(%)
    min-gain: 0.5
    # 高开上限(%)：开盘涨幅超过该值视为跳空追高
    max-open-gain: 3.0
    # 收盘位置下限(0~1)：收盘价相对当日[最低,最高]区间的比例
    min-close-pos: 0.7
    # 尾盘30分钟涨跌下限(%)：负值表示允许小幅回落，过滤真正的尾盘跳水
    min-tail-change: -0.5
    # 量比区间：下限=放量确认，上限=过度放量（分歧大，次日易回落）
    # 数据来源：腾讯分时接口同一次响应里的 qt 实时行情块（请求时刻的值），取不到才退回行情表
    min-volume-ratio: 1.2
    max-volume-ratio: 3.0
    # 换手率区间(%)：下限=流动性，上限=高位分歧/接盘
    min-turnover-rate: 3.0
    max-turnover-rate: 15.0
    # 近5日累计涨幅上限(%)：截至昨日，超过视为涨幅已透支
    max-gain-5d: 15.0
    # 相对MA5乖离上限(%)：现价偏离5日均线过远，回调概率大
    max-bias-ma5: 5.0
    # 当日成交额下限(亿元)：由分时成交量估算，过滤流动性差的票
    min-turnover-amount: 1.0
    # 理想涨幅(%)：评分时涨幅最优点，偏离越远得分越低
    ideal-gain: 2.5
    # 每日最多推荐数量（按综合评分取前N，<=0 表示不限）
    top-n: 10
    # 是否把「昨日涨停首二板」纳入候选（波动大，想更稳可设为 false）
    include-limit-up: true
    # 并行抓取分时K线的线程数
    thread-pool-size: 16
    # 尾盘30分钟对应的5分钟bar数量
    tail-bars: 6
  # 邮件推送配置（把推荐结果推到手机邮箱）
  notify:
    # 是否启用邮件推送
    enabled: true
    # 收件邮箱（多个用逗号分隔）
    to: 494417427@qq.com
    # 发件人（留空默认取 spring.mail.username）
    from:
    # 邮件主题前缀
    subject: 尾盘推荐

