# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: D:/ruoyi/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: info
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: false
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password: wxx201233
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 股票数据源配置
stock:
  # 同花顺个股行情 — 数据来自 stock-tools Node.js 抓取脚本
  ths:
    quote:
      # 抓取结果 JSON 文件路径（由 stock-tools/fetchers/ths-quote.js 生成）
      data-file: ../stock-tools/data/ths_quotes.json
    funds:
      # 概念资金流向 JSON 文件路径
      concept-file: ../stock-tools/data/ths_funds_concept.json
      # 行业资金流向 JSON 文件路径
      industry-file: ../stock-tools/data/ths_funds_industry.json
  # 同花顺板块排名
  blockrank:
    origin: https://m.10jqka.com.cn
    referer: https://m.10jqka.com.cn/
    autoCreateStock: true
    fullReplace: true
  # K线数据源
  kline:
    tencent:
      base-url: https://proxy.finance.qq.com
  # 财联社数据源
  cls:
    sign: 6dfce97fbf19527e4957cca0127feafd
  # 行业/概念资金流向推荐引擎配置
  fund-flow-recommend:
    # 回看交易日数（资金面）
    lookback-days: 5
    # 最少连续净流入天数
    min-consecutive-days: 3
    # 累计净流入阈值（亿）
    min-net-inflow: 1.0
    # 最少公司家数（0 表示不限制）
    min-total: 0
    # 趋势回看交易日数（计算区间涨幅与 MA5/MA10）
    trend-window: 15
    # 区间涨幅阈值(%)，仅当区间涨幅 > 该值才判定走势向上
    min-trend-pct: 0
    # 趋势面（区间涨幅）权重
    weight-trend: 0.5
    # 资金面（累计净流入）权重
    weight-fund: 0.5
    # 每个类型最多推荐数量
    top-n: 10
    # 涨幅TOP同步数量（每个类型取当前涨幅前 N 个，行业+概念共 2N 个）
    top-zdf-n: 7
  # 趋势上涨选股配置
  rising-trend:
    # 历史回看日历天数（a，默认30，可配置）
    lookback-days: 30
    # 最少K线数（用于收盘价数量下限判定：收盘价数量 < minKlines 则过滤）
    min-klines: 15
    # 最低点到最新点的最少K线根数（含端点，合计 < 该值则过滤）
    min-low-days: 5
    # 是否要求整体上涨（末个收盘价 > 首个收盘价）
    require-overall-up: true
    # 是否排除 ST/*ST 股票
    exclude-st: true
    # 扫描市场列表（逗号分隔）
    markets: SH,SZ
    # 偏离数量上限比例：整个收盘价链上偏离（下跌）次数 <= ceil(收盘价数量 * 该值)
    max-deviation-ratio: 0.2
    # 偏离程度上限比例：偏离累计跌幅 / (最高点 - 最低点) <= 该值
    max-deviation-degree: 0.2
    # 涨停判定阈值(%)：切片链上任一天相对前收涨幅 >= 该值视为涨停，直接过滤
    limit-up-threshold: 9.8
    # 排除的板块代码前缀（逗号分隔），默认排除创业板(300/301)、科创板(688/689)
    exclude-code-prefixes: 300,301,688,689
  # 适合做T选股配置
  day-trading:
    # 回看交易日数（近N日）
    lookback-days: 7
    # 最少有效快照天数（不足则过滤）
    min-klines: 7
    # 近N日最小振幅(%)下限（取窗口内振幅最小那天，最差那天也需达标）
    min-amplitude: 5.0
    # 近N日平均换手率(%)下限
    min-turnover-rate: 3.0
    # 近N日平均成交额下限（亿）
    min-turnover-amount: 1.0
    # 近N日平均量比下限
    min-volume-ratio: 1.0
    # 是否排除 ST/*ST 股票
    exclude-st: true
    # 扫描市场列表（逗号分隔）
    markets: SH,SZ
    # 排除的板块代码前缀（逗号分隔），默认排除创业板(300/301)、科创板(688/689)
    exclude-code-prefixes: 300,301,688,689

